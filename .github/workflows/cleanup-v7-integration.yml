name: Cleanup Temporary v7 Integration Gates
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'v7-payload-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary integration workflows
        run: |
          rm -f .github/workflows/integrate-v7-payload.yml
          rm -f .github/workflows/cleanup-v7-integration.yml
      - name: Restore clean main CI state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: remove temporary v7 integration gates"
          git push origin HEAD:main
