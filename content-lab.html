<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Language OS v6.2 — Content Lab</title><style>:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dfe7f1;--p:#4f46e5;--p2:#06b6d4}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",sans-serif;background:linear-gradient(140deg,#eef2ff,#f8fafc 45%,#ecfeff);color:var(--ink)}header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 22px}h1{margin:0;font-size:20px}.sub{color:var(--muted);font-size:12px;margin-top:5px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select{font:inherit;border:1px solid var(--line);background:white;border-radius:12px;padding:9px 12px}button.active{background:var(--p);color:white;border-color:var(--p)}main{max-width:1400px;margin:auto;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px}.stat,.lesson,.detail{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(30,50,90,.06)}.stat{padding:15px}.stat strong{font-size:25px;display:block}.stat span{font-size:11px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:16px;margin-top:16px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}.lesson{padding:15px;cursor:pointer;transition:.18s}.lesson:hover,.lesson.active{transform:translateY(-2px);border-color:var(--p);box-shadow:0 15px 35px rgba(79,70,229,.13)}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:10px;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}.lesson h3{font-size:15px;margin:10px 0 6px}.lesson p{font-size:11px;color:var(--muted);line-height:1.8;margin:0}.detail{position:sticky;top:125px;padding:18px;max-height:calc(100vh - 145px);overflow:auto}.detail h2{font-size:19px;margin:0 0 6px}.target{direction:ltr;text-align:left;color:var(--p);font-weight:700}.section{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.section h4{margin:0 0 9px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f1f5f9;border-radius:10px;padding:7px 9px;font-size:11px}.task{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}.task b{font-size:12px}.task small{color:var(--muted);display:block;margin-top:5px}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.detail{position:static;max-height:none}.list{grid-template-columns:1fr}}</style></head><body><header><h1>آزمایشگاه محتوای تألیفی v6.2</h1><div class="sub">بازبینی هدف، واژگان، تمرین، Rubric و مأموریت واقعی پیش از ورود به برنامه اصلی</div><div class="controls" id="profiles"></div><div class="controls"><select id="lang"><option value="">هر دو زبان</option><option value="en">English</option><option value="de">Deutsch</option></select><select id="level"><option value="">همه سطح‌ها</option><option>PRE</option><option>A0</option><option>A1</option><option>B1</option></select><button id="reset">پاک‌کردن فیلتر</button></div></header><main><div class="stats" id="stats"></div><div class="layout"><div class="list" id="list"></div><aside class="detail" id="detail"><div class="empty">یک درس را برای بازبینی انتخاب کنید.</div></aside></div></main><script src="./content/packs/foundation-tranche-1.js"></script><script src="./js/content-registry.js"></script><script>const names={saeed:'سعید',arezoo:'آرزو',elena:'النا',aria:'آریا'},profiles=['saeed','arezoo','elena','aria'];let filters={profile:'saeed',language:'',level:''},selected=null;const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function get(){return FLH_CONTENT.registry.find(filters)}function renderProfiles(){$('#profiles').innerHTML=profiles.map(p=>`<button data-p="${p}" class="${filters.profile===p?'active':''}">${names[p]}</button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{filters.profile=b.dataset.p;selected=null;render()})}function renderStats(){const i=get(),m={lessons:i.length,tasks:i.reduce((s,l)=>s+l.tasks.length,0),vocab:i.reduce((s,l)=>s+l.vocabulary.length,0),missions:i.filter(l=>l.mission).length};$('#stats').innerHTML=[['درس تألیفی',m.lessons],['تمرین تعاملی',m.tasks],['واژه و عبارت',m.vocab],['مأموریت واقعی',m.missions]].map(x=>`<div class="stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}function renderList(){const i=get();$('#list').innerHTML=i.length?i.map(l=>`<article class="lesson ${selected===l.id?'active':''}" data-id="${l.id}"><div class="badges"><span class="badge">${l.language==='en'?'EN':'DE'}</span><span class="badge">${l.level}</span><span class="badge">${l.minutes} دقیقه</span></div><h3>${esc(l.titleFa)}</h3><p class="target">${esc(l.titleTarget)}</p><p>${esc(l.objectiveFa)}</p></article>`).join(''):`<div class="empty">درس منطبق با فیلتر پیدا نشد.</div>`;document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{selected=x.dataset.id;renderList();renderDetail()})}function renderDetail(){const l=FLH_CONTENT.registry.get(selected);if(!l){$('#detail').innerHTML='<div class="empty">یک درس را انتخاب کنید.</div>';return}$('#detail').innerHTML=`<div class="badges"><span class="badge">${l.profile}</span><span class="badge">${l.language}</span><span class="badge">${l.level}</span></div><h2>${esc(l.titleFa)}</h2><div class="target">${esc(l.titleTarget)}</div><p>${esc(l.objectiveFa)}</p><div class="section"><h4>Can-do</h4><p class="target">${esc(l.canDo)}</p></div><div class="section"><h4>واژگان</h4><div class="chips">${l.vocabulary.map(v=>`<span class="chip"><b>${esc(v.target)}</b> — ${esc(v.fa)}</span>`).join('')}</div></div><div class="section"><h4>عبارت‌های مدل</h4>${l.phrases.map(p=>`<div class="chip target">${esc(p)}</div>`).join('')}</div><div class="section"><h4>تمرین‌ها</h4>${l.tasks.map((t,i)=>`<div class="task"><b>${i+1}. ${esc(t.promptFa)}</b><small>${esc(t.type)} · ${esc(t.skill)}</small></div>`).join('')}</div><div class="section"><h4>مأموریت واقعی</h4><p>${esc(l.mission.fa)}</p></div><div class="section"><h4>معیار عبور</h4><div class="chips">${l.rubric.criteria.map(c=>`<span class="chip">${esc(c.fa)} ${c.weight}%</span>`).join('')}</div></div>`}function render(){renderProfiles();renderStats();renderList();renderDetail()}$('#lang').onchange=e=>{filters.language=e.target.value;selected=null;render()};$('#level').onchange=e=>{filters.level=e.target.value;selected=null;render()};$('#reset').onclick=()=>{filters={profile:'saeed',language:'',level:''};$('#lang').value='';$('#level').value='';selected=null;render()};render();</script></body></html>
