<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c2538">
  <meta name="description" content="سیستم‌عامل یادگیری خانوادگی انگلیسی و آلمانی از صفر تا C2">
  <title>Family Language OS — خانه زبان خانواده</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-profile="saeed" data-language="en">
  <div id="boot" class="boot">
    <div class="boot-card"><div class="boot-logo">F</div><strong>Family Language OS</strong><small>در حال آماده‌سازی مسیر اختصاصی…</small></div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div><strong>خانه زبان خانواده</strong><small>Learning OS · v6.1 Core</small></div>
      </div>
      <div id="familyRail" class="family-rail"></div>
      <nav id="mainNav" class="main-nav">
        <button data-view="today" class="active"><span>☀️</span>امروز</button>
        <button data-view="path"><span>🗺️</span>مسیر</button>
        <button data-view="practice"><span>🎯</span>تمرین</button>
        <button data-view="library"><span>📚</span>کتابخانه</button>
        <button data-view="family"><span>👨‍👩‍👧‍👦</span>خانواده</button>
        <button data-view="me"><span>⚙️</span>من</button>
      </nav>
      <div class="sidebar-foot">
        <div id="syncState" class="sync-state"><i></i><span>ذخیره محلی فعال</span></div>
        <button id="openSessionGate" class="ghost-btn">تغییر نشست</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p id="eyebrow" class="eyebrow">برنامه تطبیقی امروز</p>
          <h1 id="pageTitle">امروز</h1>
        </div>
        <div class="top-actions">
          <button id="focusBtn" class="icon-btn" title="تمرکز">⏱️</button>
          <button id="backupBtn" class="icon-btn" title="پشتیبان">💾</button>
          <div id="activeIdentity" class="active-identity"></div>
        </div>
      </header>
      <section id="viewRoot" class="view-root"></section>
    </main>
  </div>

  <dialog id="sessionGate" class="session-gate">
    <form method="dialog" id="sessionForm">
      <div class="gate-head"><div><small>شروع یک نشست جدید</small><h2>چه کسی، کدام زبان و چه هدفی؟</h2></div><button value="cancel" class="close-btn" aria-label="بستن">×</button></div>
      <div class="gate-grid">
        <section><h3>۱. عضو خانواده</h3><div id="gateProfiles" class="profile-grid"></div></section>
        <section><h3>۲. زبان</h3><div id="gateLanguages" class="choice-grid two"></div></section>
        <section><h3>۳. سطح/مسیر</h3><div id="gateLevels" class="level-grid"></div></section>
        <section><h3>۴. مدت و تمرکز</h3><div id="gateDurations" class="choice-grid"></div><label class="field">هدف امروز<select id="gateGoal"></select></label></section>
      </div>
      <div class="gate-actions"><span id="gateSummary" class="gate-summary"></span><button id="startSessionBtn" value="default" class="primary-btn">ساخت برنامه امروز</button></div>
    </form>
  </dialog>

  <dialog id="taskDialog" class="task-dialog"><div id="taskDialogBody"></div></dialog>
  <dialog id="focusDialog" class="focus-dialog"><div id="focusDialogBody"></div></dialog>
  <input id="restoreInput" type="file" accept="application/json" hidden>

  <script src="config.js"></script>
  <script src="js/profile-images.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
