function units(pf=p(),l=lang()){const list=lessons(pf,l),map=new Map();for(const x of list){if(!map.has(x.theme))map.set(x.theme,[]);map.get(x.theme).push(x)}const titles={research:['🔬','پژوهش و مقاله'],academic:['🎓','زبان دانشگاهی'],ielts:['📝','IELTS'],interview:['🎤','مصاحبه'],risk:['⚠️','زبان ریسک'],application:['✉️','اپلای'],life:['🛒','زندگی روزمره'],tech:['💻','فناوری'],career:['💼','کار'],daily:['☀️','مکالمه روزانه'],family:['🏠','خانواده'],alphabet:['🔤','الفبا'],phonics:['🔊','فونیک'],school:['🏫','مدرسه'],science:['🧪','علوم'],story:['📚','داستان'],social:['🤝','دوستی'],digital:['🛡️','ایمنی دیجیتال'],presentation:['🎙️','ارائه'],nature:['🌿','طبیعت'],colors:['🎨','رنگ‌ها'],animals:['🐾','حیوانات'],movement:['🏃','حرکت'],numbers:['🔢','عددها'],migration:['🧳','زندگی مهاجرتی'],hse:['⛑️','ایمنی کار']};return[...map].map(([k,v])=>({key:k,icon:(titles[k]||['📘',k])[0],title:(titles[k]||['📘',k])[1],lessons:v}))}
function dueLessons(){const list=lessons(),done=completed();return list.filter(x=>done.has(x.id)).sort((a,b)=>lessonMastery(a.id)-lessonMastery(b.id)).slice(0,2)}
function todayPlan(pf=p(),l=lang()){const list=lessons(pf,l),done=completed(pf.id,l),newL=list.filter(x=>!done.has(x.id)),due=dueLessons();let q=[];if(pf.ageBand==='preschool_3_4'){q=[{type:'warmup',icon:'👋',title:'سلام و حرکت',minutes:1,skill:'speaking'},...newL.slice(0,1).map(x=>({type:'lesson',lesson:x,icon:'🧸',title:x.fa,minutes:Math.min(4,x.minutes),skill:x.skill})),{type:'parent',icon:'⭐',title:'بازی با شیء واقعی',minutes:2,skill:'listening'}];return q}
if(pf.ageBand==='school_10_12'){const alpha=newL.find(x=>['alphabet','phonics'].includes(x.theme));if(alpha)q.push({type:'lesson',lesson:alpha,icon:'🔤',title:alpha.fa,minutes:6,skill:alpha.skill});const school=newL.find(x=>!['alphabet','phonics'].includes(x.theme));if(school)q.push({type:'lesson',lesson:school,icon:'📚',title:school.fa,minutes:8,skill:school.skill});q.push({type:'game',icon:'🎮',title:'بازی شنیدن و انتخاب',minutes:6,skill:'listening'});q.push({type:'review',icon:'⭐',title:'مرور و ستاره امروز',minutes:3,skill:'speaking'});return q}
if(pf.id==='arezoo'){q.push(...newL.slice(0,2).map((x,i)=>({type:'lesson',lesson:x,icon:i?'🗣️':'🛒',title:x.fa,minutes:10,skill:x.skill})));q.push({type:'scenario',icon:'🎭',title:'نقش‌آفرینی زندگی واقعی',minutes:10,skill:'speaking'});q.push({type:'review',icon:'🧠',title:'مرور واژه‌های A1',minutes:7,skill:'listening'});return q}
q.push(...newL.slice(0,2).map((x,i)=>({type:'lesson',lesson:x,icon:i?'🧪':'🎓',title:x.fa,minutes:18,skill:x.skill})));if(due[0])q.push({type:'lesson',lesson:due[0],icon:'🔁',title:'مرور: '+due[0].fa,minutes:12,skill:due[0].skill});q.push({type:'research',icon:'🎤',title:'تمرین ۹۰ ثانیه‌ای پژوهش',minutes:15,skill:'speaking'});return q}
function applyTheme(){document.body.dataset.profile=p().id;document.body.dataset.lang=lang();document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.body).getPropertyValue('--nav').trim()||'#10253d'}
function toast(t){document.getElementById('toastRoot').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2500)}function modal(h){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalBox">${h}</div></div>`}window.closeModal=()=>document.getElementById('modalRoot').innerHTML='';

function renderToday(){const s=stats(),plan=todayPlan(),target=p().dailyMinutes,pc=Math.min(100,Math.round(s.today/Math.max(1,target)*100)),skillCards=Object.keys(SKILL).map(k=>`<div class="card skillCard"><strong><span>${ICON[k]} ${SKILL[k]}</span><span>${s.skills[k]}%</span></strong><div class="bar" style="margin-top:9px"><i style="width:${s.skills[k]}%"></i></div></div>`).join('');document.getElementById('page-today').innerHTML=`<div class="grid heroGrid"><div class="card hero"><span class="pill">${LANG[lang()].flag} ${level()}</span><h3>${greeting()} ${esc(p().name)}</h3><p>${goalText()}</p><div class="heroStats"><div class="mini"><strong>${s.today}</strong><small>دقیقه امروز</small></div><div class="mini"><strong>${s.streak}</strong><small>روز پیوسته</small></div><div class="mini"><strong>${s.done.length}</strong><small>درس تکمیل‌شده</small></div><div class="mini"><strong>${s.reviews}</strong><small>مرور ثبت‌شده</small></div></div><div class="heroActions"><button class="btn primary" onclick="startPlan()">شروع برنامه امروز</button><button class="btn" onclick="showGate(true)">تغییر عضو یا زبان</button></div></div><div class="card"><div class="sectionHead"><h3>هدف امروز</h3><small>${s.today}/${target} دقیقه</small></div><div style="position:relative"><div class="progressRing" style="--pct:${pc}%"></div><div class="ringText"><strong>${pc}%</strong><span>برنامه روزانه</span></div></div><div class="notice ${pc>=100?'good':''}" style="margin-top:10px">${coachMessage(pc)}</div></div></div><div class="grid four" style="margin-top:14px">${skillCards}</div><div class="grid two" style="margin-top:14px"><div class="card"><div class="sectionHead"><h3>صف فعالیت امروز</h3><small>تولیدشده بر اساس سن، سطح و پیشرفت</small></div><div class="queue">${plan.map((x,i)=>queueHtml(x,i)).join('')}</div></div><div class="card"><div class="sectionHead"><h3>${sideWidgetTitle()}</h3><small>متناسب با این عضو</small></div>${sideWidget()}</div></div>`}
function greeting(){const h=new Date().getHours();return h<12?'صبح بخیر،':h<18?'روز بخیر،':'عصر بخیر،'}function goalText(){if(p().id==='saeed')return'امروز یک گام برای IELTS، اپلای دکتری و ارائه حرفه‌ای پژوهش بردارید.';if(p().id==='arezoo')return'تمرین امروز باید در خرید، آشپزخانه، مدرسه کودکان یا کار واقعی استفاده شود.';if(p().id==='elena')return'هر مرحله کوتاه، روشن و همراه با بازی، صدا و یک خروجی قابل نشان‌دادن است.';return'جلسه آریا کوتاه، شاد و والد‌همراه است؛ شنیدن، اشاره و حرکت مهم‌تر از حفظ‌کردن است.'}function coachMessage(pc){return pc>=100?'برنامه امروز کامل است. مرور سبک یا استراحت کافی است.':pc>=50?'نیمه اصلی کار انجام شده؛ یک فعالیت کوتاه دیگر کافی است.':'برنامه را با اولین فعالیت کوچک شروع کنید؛ لازم نیست همه چیز یک‌باره انجام شود.'}
function queueHtml(x,i){const done=state.session?.completed?.includes(i);return`<div class="queueItem ${done?'done':''}"><span class="queueIcon">${x.icon}</span><span><strong>${esc(x.title)}</strong><small>${SKILL[x.skill]||'فعالیت'} · ${x.minutes} دقیقه</small></span><button class="btn ${done?'outline':'primary'}" onclick="runPlanItem(${i})">${done?'مرور':'شروع'}</button></div>`}
function sideWidgetTitle(){return p().id==='saeed'?'عدد امروز پژوهش':p().id==='arezoo'?'ماموریت عملی امروز':p().id==='elena'?'نشان ماجراجویی امروز':'راهنمای والد امروز'}function sideWidget(){if(p().id==='saeed')return`<div class="notice"><b>۷۷ ریسک · ۱۰٬۰۰۰ تکرار · P90</b><br>این سه عدد را در ۳۰ ثانیه به انگلیسی توضیح دهید، بدون اینکه P90 را احتمال حادثه بنامید.</div><button class="btn soft" style="margin-top:10px" onclick="setPage('research')">ورود به آزمایشگاه پژوهش</button>`;if(p().id==='arezoo')return`<div class="notice warn"><b>ماموریت:</b> یک فهرست خرید واقعی پنج‌قلمی بسازید و سه قلم آن را با مقدار و قیمت در زبان انتخابی بگویید.</div><button class="btn soft" style="margin-top:10px" onclick="setPage('life')">بازکردن مرکز زندگی واقعی</button>`;if(p().id==='elena')return`<div style="text-align:center;font-size:55px">🏅</div><div class="notice">امروز با تکمیل یک درس و یک بازی، نشان «کاوشگر واژه» فعال می‌شود.</div>`;return`<div class="notice warn"><b>قانون ۳ سالگی:</b> صفحه را به کودک نسپارید. صدا را پخش کنید، شیء واقعی نشان دهید، با حرکت پاسخ بگیرید و بعد از ۵ تا ۸ دقیقه تمام کنید.</div>`}
window.startPlan=()=>{state.session={profileId:p().id,language:lang(),duration:p().dailyMinutes,completed:[],startedAt:now()};save();runPlanItem(0)};window.runPlanItem=i=>{const plan=todayPlan(),x=plan[i];if(!x)return;if(x.type==='lesson')openLesson(x.lesson.id,i);else if(x.type==='game')startGame('listen',i);else if(x.type==='scenario'){setPage('life');toast('سناریوی زندگی واقعی را باز کنید')}else if(x.type==='research'){startResearchTimer(i)}else if(x.type==='parent')openParentActivity(i);else completeSimple(i,x)};
function completeSimple(i,x){addEvent({type:'guided_activity',minutes:x.minutes,skill:x.skill,payload:{title:x.title}});markPlan(i);renderToday();toast('فعالیت ثبت شد')}function markPlan(i){state.session=state.session||{completed:[]};state.session.completed=state.session.completed||[];if(!state.session.completed.includes(i))state.session.completed.push(i);save()}
function renderPath(){const us=units(),done=completed();document.getElementById('page-path').innerHTML=`<div class="card"><div class="sectionHead"><div><h3>نقشه یادگیری ${esc(p().name)}</h3><small>${LANG[lang()].fa} · ${level()}</small></div><span class="pill">${lessons().length} درس فعال</span></div><div class="pathMap">${us.map((u,idx)=>{const n=u.lessons.filter(x=>done.has(x.id)).length,pc=Math.round(n/u.lessons.length*100);return`<article class="card unit"><span class="unitIcon">${u.icon}</span><h4>${esc(u.title)}</h4><p>${unitDescription(u.key)}</p><div class="unitFooter"><div class="bar"><i style="width:${pc}%"></i></div><small>${n}/${u.lessons.length}</small></div><button class="btn soft" onclick="openUnit('${u.key}')">مشاهده مراحل</button></article>`}).join('')}</div></div>`}
function unitDescription(k){const d={research:'ارائه پایان‌نامه، مقاله، عدم‌قطعیت و دفاع علمی.',life:'خرید، آشپزخانه، خانه و مکالمه قابل استفاده.',alphabet:'شناخت حرف، شکل و صدای آغازین.',phonics:'ترکیب صداها و خواندن واژه.',school:'کلاس، تکلیف، سؤال و ارائه.',tech:'واژگان کامپیوتر و کار دیجیتال.',ielts:'چهار مهارت آزمون و زبان آکادمیک.',daily:'عبارت‌های ضروری زندگی روزمره.'};return d[k]||'مجموعه‌ای از درس‌های مرحله‌بندی‌شده برای هدف فعلی.'}window.openUnit=k=>{const u=units().find(x=>x.key===k),done=completed();modal(`<div class="modalHead"><div><span class="pill">${u.icon} ${esc(u.title)}</span><h3>مراحل این واحد</h3></div><button class="close" onclick="closeModal()">×</button></div><div class="lessonList" style="margin-top:13px">${u.lessons.map((x,i)=>`<div class="lessonRow"><span class="idx">${done.has(x.id)?'✓':i+1}</span><span><strong>${esc(x.fa)}</strong><small class="ltr">${esc(x.title)} · ${SKILL[x.skill]}</small></span><button class="btn ${done.has(x.id)?'outline':'primary'}" onclick="openLesson('${x.id}')">${done.has(x.id)?'مرور':'شروع'}</button></div>`).join('')}</div>`)};
function renderAlphabet(){const arr=DATA.alphabets[lang()],phon=DATA.phonics[lang()],child=p().ageBand!=='adult';document.getElementById('page-alphabet').innerHTML=`<div class="card"><div class="sectionHead"><div><h3>الفبا و صداهای ${LANG[lang()].fa}</h3><small>${p().id==='aria'?'تماس شنیداری و بازی':p().id==='elena'?'حرف، صدا، واژه و نوشتن':'مرور تلفظ و املا'}</small></div><div class="alphabetToolbar"><button class="btn soft" onclick="playAlphabet(0)">پخش از ابتدا</button><button class="btn outline" onclick="openTracing()">تمرین نوشتن</button></div></div><div class="notice ${p().id==='aria'?'warn':''}">${p().id==='aria'?'در هر نشست فقط ۲ یا ۳ حرف انتخاب کنید. هدف آشنایی با صداست، نه حفظ ترتیب.':p().id==='elena'?'هر حرف را ببین، بشنو، با انگشت دنبال کن و یک واژه با آن پیدا کن.':'برای اصلاح املا و تلفظ، حرف و مثال را با صدا مرور کنید.'}</div><div class="alphabetGrid" style="margin-top:13px">${arr.map((x,i)=>`<button class="letter" onclick="letterDetail(${i})"><b>${esc(x.letter)}<small>${esc(x.lower)}</small></b><span>${esc(x.sound)}</span><em>${esc(x.example)}</em></button>`).join('')}</div></div><div class="card" style="margin-top:14px"><div class="sectionHead"><h3>ایستگاه فونیک</h3><small>بعد از شناخت حروف</small></div><div class="grid three">${phon.map(x=>`<div class="card"><b class="ltr" style="font-size:25px;color:var(--primary)">${esc(x.pattern)}</b><h4>${esc(x.title)}</h4><div class="wordChips ltr">${x.examples.map(w=>`<button onclick='speakText(${JSON.stringify(w)},"${lang()}")'>${esc(w)} 🔊</button>`).join('')}</div></div>`).join('')}</div></div>`}
window.letterDetail=i=>{const x=DATA.alphabets[lang()][i];modal(`<div class="modalHead"><div><span class="pill">حرف ${i+1}</span><h3 class="ltr" style="font-size:38px">${esc(x.letter)} ${esc(x.lower)}</h3></div><button class="close" onclick="closeModal()">×</button></div><div class="gameStage"><div><div class="bigPrompt">${esc(x.example)}</div><p>${esc(x.sound)}</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn primary" onclick='speakText(${JSON.stringify(x.example)},"${lang()}",.75)'>شنیدن مثال</button><button class="btn outline" onclick='speakText(${JSON.stringify(x.letter)},"${lang()}",.7)'>شنیدن حرف</button></div></div></div>`)};window.playAlphabet=i=>{const arr=DATA.alphabets[lang()];if(i>=arr.length)return;const u=new SpeechSynthesisUtterance(`${arr[i].letter}. ${arr[i].example}`);u.lang=LANG[lang()].speech;u.rate=.72;u.onend=()=>setTimeout(()=>playAlphabet(i+1),120);speechSynthesis.speak(u)};
window.openTracing=()=>{const first=DATA.alphabets[lang()][0].letter;modal(`<div class="modalHead"><div><span class="pill">تمرین حرکتی</span><h3>ردگیری و نوشتن حرف</h3></div><button class="close" onclick="closeModal()">×</button></div><div class="traceWrap" style="margin-top:13px"><div><div class="field"><label>حرف تمرین</label><select id="traceSelect" onchange="changeTrace(this.value)">${DATA.alphabets[lang()].map(x=>`<option>${esc(x.letter)}</option>`).join('')}</select></div><div class="notice" style="margin-top:10px">برای آریا فقط با انگشت در هوا یا روی شن/آرد بازی کنید. برای النا، مسیر حرف را آرام دنبال کنید.</div></div><div><div id="traceBoard" class="traceBoard"><div id="traceGhost" class="traceGhost">${esc(first)}</div><canvas id="traceCanvas"></canvas></div><div class="traceControls"><button class="btn soft" onclick="clearTrace()">پاک‌کردن</button><button class="btn primary" onclick="saveTrace()">ثبت تمرین</button></div></div></div>`);setTimeout(initTrace,30)};let traceCtx,traceCanvas,drawing=false;function initTrace(){traceCanvas=document.getElementById('traceCanvas');if(!traceCanvas)return;const r=traceCanvas.parentElement.getBoundingClientRect();traceCanvas.width=r.width*devicePixelRatio;traceCanvas.height=r.height*devicePixelRatio;traceCanvas.style.width=r.width+'px';traceCanvas.style.height=r.height+'px';traceCtx=traceCanvas.getContext('2d');traceCtx.scale(devicePixelRatio,devicePixelRatio);traceCtx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--primary');traceCtx.lineWidth=8;traceCtx.lineCap='round';const pos=e=>{const q=traceCanvas.getBoundingClientRect(),t=e.touches?.[0]||e;return[t.clientX-q.left,t.clientY-q.top]};const start=e=>{drawing=true;const [x,y]=pos(e);traceCtx.beginPath();traceCtx.moveTo(x,y);e.preventDefault()},move=e=>{if(!drawing)return;const [x,y]=pos(e);traceCtx.lineTo(x,y);traceCtx.stroke();e.preventDefault()},end=()=>drawing=false;['mousedown','touchstart'].forEach(n=>traceCanvas.addEventListener(n,start,{passive:false}));['mousemove','touchmove'].forEach(n=>traceCanvas.addEventListener(n,move,{passive:false}));['mouseup','mouseleave','touchend'].forEach(n=>traceCanvas.addEventListener(n,end))}window.changeTrace=v=>document.getElementById('traceGhost').textContent=v;window.clearTrace=()=>{if(traceCtx)traceCtx.clearRect(0,0,traceCanvas.width,traceCanvas.height)};window.saveTrace=()=>{addEvent({type:'letter_trace',minutes:3,skill:'writing',payload:{letter:document.getElementById('traceSelect').value}});toast('تمرین نوشتن ثبت شد')};

function renderLife(){const lab=DATA.lifeLabs[p().id]?.[lang()];if(!lab){document.getElementById('page-life').innerHTML='<div class="card">برای این عضو بخش زندگی واقعی جداگانه تعریف نشده است.</div>';return}const keys=p().id==='arezoo'?['grocery','kitchen','school','tech']:['grocery','kitchen'];const tabs=keys.map((k,i)=>`<button class="${i?'':'active'}" data-scenario="${k}">${SCENARIOS[lang()]?.[k]?.icon||'🎭'} ${esc(SCENARIOS[lang()]?.[k]?.title||k)}</button>`).join('');document.getElementById('page-life').innerHTML=`<div class="card hero"><span class="pill">تمرین عملیاتی</span><h3>${esc(lab.title)}</h3><p>هدف این بخش تولید خروجی واقعی است: فهرست خرید، مکالمه، پیام، دستور غذا یا تماس مدرسه.</p></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="sectionHead"><h3>سناریوهای نقش‌آفرینی</h3><small>بخوان، بشنو و اجرا کن</small></div><div class="scenarioTabs">${tabs}</div><div id="scenarioArea" style="margin-top:12px"></div></div><div class="card"><div class="sectionHead"><h3>فهرست خرید شخصی</h3><small>قابل استفاده در دو دستگاه</small></div><div class="shoppingBuilder"><input id="shopInput" placeholder="مثلاً milk / Milch"><button class="btn primary" onclick="addShop()">افزودن</button></div><div id="shoppingList" class="shoppingList"></div><div class="notice warn" style="margin-top:10px">برای تمرین بهتر، مقدار هم اضافه کنید: two bottles, one kilo, a packet.</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="sectionHead"><h3>واژه‌های ضروری</h3><small>با صدای مرورگر</small></div><div class="wordChips ltr">${[...(lab.shopping||[]),...(lab.kitchen||[])].map(x=>`<button onclick='speakText(${JSON.stringify(x)},"${lang()}")'>${esc(x)} 🔊</button>`).join('')}</div></div><div class="card"><div class="sectionHead"><h3>ماموریت‌های هفته</h3></div><div class="checklist">${lab.missions.map((x,i)=>{const k=`mission-${p().id}-${lang()}-${i}`,d=!!state.checks[k];return`<label class="check ${d?'done':''}"><input type="checkbox" ${d?'checked':''} onchange="toggleCheck('${k}',this.checked)"><span>${esc(x)}</span><span>✓</span></label>`}).join('')}</div></div></div>`;bindScenarioTabs();renderScenario(keys[0]);renderShopping()}
function bindScenarioTabs(){document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-scenario]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderScenario(b.dataset.scenario)})}function renderScenario(k){const s=SCENARIOS[lang()]?.[k];if(!s)return;document.getElementById('scenarioArea').innerHTML=`<div class="scenarioCard"><div class="dialogue">${s.dialogue.map(([who,t])=>`<div class="bubble ${who==='Me'||who==='Ich'?'me':''}"><b>${esc(who)}:</b> <span class="ltr">${esc(t)}</span> <button style="border:0;background:transparent" onclick='speakText(${JSON.stringify(t)},"${lang()}")'>🔊</button></div>`).join('')}</div><div class="checklist">${s.tasks.map((x,i)=>`<label class="check"><input type="checkbox" onchange="if(this.checked)addEvent({type:'scenario_task',minutes:4,skill:'speaking',payload:{scenario:'${k}',task:${i}}})"><span class="ltr">${esc(x)}</span><span>🎯</span></label>`).join('')}</div></div>`}window.addShop=()=>{const v=document.getElementById('shopInput').value.trim();if(!v)return;state.shopping.arezoo=state.shopping.arezoo||{en:[],de:[]};state.shopping.arezoo[lang()]=state.shopping.arezoo[lang()]||[];state.shopping.arezoo[lang()].push({id:uid(),text:v,done:false});save();document.getElementById('shopInput').value='';renderShopping()};function renderShopping(){const box=document.getElementById('shoppingList');if(!box)return;const arr=state.shopping?.arezoo?.[lang()]||[];box.innerHTML=arr.length?arr.map(x=>`<div class="shopItem"><label><input type="checkbox" ${x.done?'checked':''} onchange="toggleShop('${x.id}',this.checked)"> <span class="ltr">${esc(x.text)}</span></label><button class="btn outline" onclick="removeShop('${x.id}')">×</button></div>`).join(''):'<div class="muted">هنوز موردی اضافه نشده است.</div>'}window.toggleShop=(id,v)=>{const x=state.shopping.arezoo[lang()].find(x=>x.id===id);if(x)x.done=v;save();renderShopping()};window.removeShop=id=>{state.shopping.arezoo[lang()]=state.shopping.arezoo[lang()].filter(x=>x.id!==id);save();renderShopping()};window.toggleCheck=(k,v)=>{state.checks[k]=v;if(v)addEvent({type:'mission_complete',minutes:5,skill:'speaking',payload:{key:k}});save();renderLife()};
const RESEARCH_QA=[['Why did you not rely only on the conventional RPN?','Because a point RPN hides score imprecision and may treat different S-O-D profiles as equivalent. The probabilistic layer was used to qualify, not replace, the auditable FMEA baseline.'],['What does P90 mean in your study?','It is the 90th percentile of the simulated RPN distribution under the stated uncertainty model. It is not an empirical accident probability.'],['Why did you use Monte Carlo simulation?','To propagate stated uncertainty in severity, occurrence and detection scores and examine the stability of prioritisation outputs.'],['What is the difference between rank stability and decision-set stability?','Rank stability concerns overall ordering. Decision-set stability asks whether the same records cross the operational action boundary.'],['What is the main contribution of Paper 2?','It separates model-form, range, dependence, numerical and decision-rule uncertainty and distinguishes a robust core from a model-sensitive shell.']];

button></div></div>`}
function researchCard(icon,title,obj){return`<article class="card researchCard"><span style="font-size:30px">${icon}</span><h4>${title}</h4><div class="ltr muted" style="font-size:10px;line-height:1.7">${esc(obj.title)}</div>${obj.target?`<div style="margin-top:8px"><span class="pill">${esc(obj.target)}</span></div>`:''}<ul>${obj.facts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>`}window.saveResearchNote=()=>{state.notes.research=document.getElementById('researchNote').value;save();toast('متن پژوهش ذخیره شد')};let researchTimer;window.startResearchTimer=planIndex=>{let left=90;modal(`<div class="modalHead"><div><span class="pill">تمرین شفاهی</span><h3>پژوهش را در ۹۰ ثانیه معرفی کنید</h3></div><button class="close" onclick="closeModal()">×</button></div><div class="timer"><div><strong id="timerText">01:30</strong><small>با مسئله، روش، نتیجه و محدودیت جمع‌بندی کنید.</small></div></div><div class="notice">ساختار پیشنهادی: مشکل RPN نقطه‌ای → ۷۷ ریسک → مونت‌کارلو و P90 → پایداری رتبه/تصمیم → کاربرد مدیریتی.</div>`);clearInterval(researchTimer);researchTimer=setInterval(()=>{left--;const e=document.getElementById('timerText');if(e)e.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(researchTimer);addEvent({type:'research_pitch',minutes:2,skill:'speaking'});if(Number.isInteger(planIndex))markPlan(planIndex);toast('تمرین ۹۰ ثانیه‌ای ثبت شد')}},1000)};window.openAbstractBuilder=()=>modal(`<div class="modalHead"><div><span class="pill">Research Pitch Builder</span><h3>معرفی چهارمرحله‌ای پژوهش</h3></div><button class="close" onclick="closeModal()">×</button></div><div class="formGrid" style="margin-top:12px"><div class="field span2"><label>1. Problem</label><textarea class="ltr" id="ab1">Conventional FMEA compresses risk into a point RPN and does not express score uncertainty.</textarea></div><div class="field span2"><label>2. Method</label><textarea class="ltr" id="ab2">I analysed 77 haul-truck operational risks using bounded triangular distributions and Monte Carlo simulation.</textarea></div><div class="field span2"><label>3. Result</label><textarea class="ltr" id="ab3">The framework produced an auditable P90-based prioritisation and showed that high rank agreement can coexist with boundary changes.</textarea></div><div class="field span2"><label>4. Contribution and limitation</label><textarea class="ltr" id="ab4">The contribution is decision-robustness analysis; P90-RPN is not interpreted as an empirical accident probability.</textarea></div></div><button class="btn primary" style="margin-top:10px" onclick="playAbstract()">پخش معرفی کامل</button>`);window.playAbstract=()=>speak([1,2,3,4].map(i=>document.getElementById('ab'+i).value).join(' '),'en',.85);

function renderSettings(){document.getElementById('page-settings').innerHTML=`<div class="grid two"><div class="card"><div class="sectionHead"><h3>پروفایل فعال</h3><button class="btn outline" onclick="editProfile()">ویرایش</button></div><div class="formGrid"><div><b>${esc(p().name)}</b><div class="muted">نام</div></div><div><b>${ageText()}</b><div class="muted">سن/مرحله</div></div><div><b>${esc(p().education)}</b><div class="muted">تحصیلات</div></div><div><b>${p().dailyMinutes} دقیقه</b><div class="muted">زمان روزانه</div></div></div></div><div class="card"><div class="sectionHead"><h3>پشتیبان محلی</h3><small>${state.events.length} رویداد</small></div><button class="btn" style="width:100%;margin-bottom:7px" onclick="exportData()">دریافت JSON</button><button class="btn" style="width:100%;margin-bottom:7px" onclick="document.getElementById('importFile').click()">بازیابی JSON</button><button class="btn danger" style="width:100%" onclick="resetApp()">پاک‌سازی این دستگاه</button></div></div><div class="card" style="margin-top:14px"><div class="sectionHead"><h3>همگام‌سازی دو دستگاه</h3><small>${cloud.configured?'Supabase پیکربندی شده':'حالت محلی فعال'}</small></div>${cloudHtml()}</div><div class="card" style="margin-top:14px"><div class="sectionHead"><h3>منابع تکمیلی</h3></div>${DATA.resources.filter(r=>r.lang===lang()&&r.audience.includes(p().id)).map(r=>`<div class="resource"><div><b>${esc(r.name)}</b><div class="muted">${esc(r.desc)}</div></div><a href="${r.url}" target="_blank" rel="noopener">بازکردن ↗</a></div>`).join('')||'<div class="muted">منبع خارجی برای این مسیر تعریف نشده است.</div>'}</div>`}
function cloudHtml(){if(!cloud.configured)return`<div class="notice">برای همگام‌سازی واقعی، پروژه Supabase را بسازید، فایل schema.sql بسته انتشار را اجرا کنید و URL و کلید عمومی را در config.js قرار دهید. محدودیت دو دستگاه در پایگاه داده اعمال می‌شود.</div>`;if(cloud.user)return`<div class="notice good">ورود فعال: ${esc(cloud.user.email||'')}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" onclick="syncNow()">همگام‌سازی</button><button class="btn outline" onclick="signOut()">خروج</button></div>`;return`<div class="formGrid"><div class="field"><label>ایمیل خانوادگی</label><input id="cloudEmail" type="email"></div><div class="field"><label>رمز عبور</label><input id="cloudPassword" type="password"></div><div class="span2"><button class="btn primary" onclick="signIn()">ورود</button> <button class="btn outline" onclick="signUp()">ساخت حساب</button></div></div>`}
window.editProfile=()=>modal(`<div class="modalHead"><div><span class="pill">ویرایش</span><h3>${esc(p().name)}</h3></div><button class="close" onclick="closeModal()">×</button></div><div class="formGrid" style="margin-top:12px"><div class="field"><label>نام</label><input id="pfName" value="${esc(p().name)}"></div><div class="field"><label>سن</label><input id="pfAge" type="number" value="${p().age??''}" placeholder="برای بزرگسال اختیاری"></div><div class="field span2"><label>تحصیلات/مرحله</label><input id="pfEdu" value="${esc(p().education)}"></div><div class="field"><label>سطح انگلیسی</label><select id="pfEn">${Object.keys(LEVELS).map(x=>`<option ${p().levels.en===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>سطح آلمانی</label><select id="pfDe">${Object.keys(LEVELS).map(x=>`<option ${p().levels.de===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>دقیقه روزانه</label><input id="pfMin" type="number" value="${p().dailyMinutes}"></div><div class="field"><label>روز در هفته</label><input id="pfDays" type="number" value="${p().weeklyDays}"></div></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="saveProfile()">ذخیره</button>`);window.saveProfile=()=>{const x=p();x.name=document.getElementById('pfName').value.trim()||x.name;const age=document.getElementById('pfAge').value;x.age=age===''?null:+age;x.education=document.getElementById('pfEdu').value.trim()||x.education;x.levels.en=document.getElementById('pfEn').value;x.levels.de=document.getElementById('pfDe').value;x.dailyMinutes=+document.getElementById('pfMin').value||x.dailyMinutes;x.weeklyDays=+document.getElementById('pfDays').value||x.weeklyDays;x.updatedAt=now();save();closeModal();renderAll();toast('پروفایل به‌روزرسانی شد')};
window.openLesson=(id,planIndex=null)=>{const x=DATA.lessons.find(y=>y.id===id);if(!x)return;const preschool=p().ageBand==='preschool_3_4';modal(`<div class="modalHead"><div><span class="pill">${LEVELS[x.level]?.[0]||'📘'} ${x.level} · ${ICON[x.skill]} ${SKILL[x.skill]}</span><h3>${esc(x.fa)}</h3><div class="ltr muted">${esc(x.title)}</div></div><button class="close" onclick="closeModal()">×</button></div>${preschool?`<div class="preschoolStage" style="margin-top:13px">${x.words.map((w,i)=>`<button class="preschoolCard" onclick='speakText(${JSON.stringify(w)},"${x.lang}",.7)'>${['⭐','🎈','🐾','🌈'][i%4]}<br>${esc(w)}</button>`).join('')}</div><div class="notice warn" style="margin-top:12px"><b>فعالیت والد:</b> ${esc(x.activity)}</div>`:`<div class="card" style="margin-top:13px"><div class="sectionHead"><h3>عبارت‌های اصلی</h3><button class="btn soft" onclick='speakText(${JSON.stringify(x.phrases.join('. '))},"${x.lang}")'>پخش کامل</button></div>${x.phrases.map(q=>`<div class="phrase">${esc(q)}</div>`).join('')}</div><div class="card" style="margin-top:9px"><div class="sectionHead"><h3>واژگان</h3></div><div class="wordChips ltr">${x.words.map(w=>`<button onclick='speakText(${JSON.stringify(w)},"${x.lang}")'>${esc(w)} 🔊</button>`).join('')}</div><div class="notice" style="margin-top:10px"><b>خروجی تمرین:</b> ${esc(x.activity)}</div><textarea id="lessonNote" style="margin-top:9px" placeholder="پاسخ یا یادداشت…">${esc(state.notes[p().id+'-'+id]||'')}</textarea></div>`}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn outline" onclick="saveLesson('${id}')">ذخیره یادداشت</button><button class="btn primary" onclick="completeLesson('${id}',${planIndex===null?'null':planIndex})">تکمیل درس</button></div>`)};window.saveLesson=id=>{const e=document.getElementById('lessonNote');if(e)state.notes[p().id+'-'+id]=e.value;save();toast('یادداشت ذخیره شد')};window.completeLesson=(id,planIndex=null)=>{const x=DATA.lessons.find(y=>y.id===id);saveLesson(id);addEvent({type:completed().has(id)?'lesson_review':'lesson_complete',lessonId:id,minutes:x.minutes,skill:x.skill,payload:{theme:x.theme}});if(planIndex!==null)markPlan(planIndex);closeModal();renderAll();toast('درس ثبت شد')};window.openParentActivity=planIndex=>{const x=lessons().find(x=>!completed().has(x.id))||lessons()[0];modal(`<div class="modalHead"><div><span class="pill">والد‌همراه</span><h3>بازی با شیء واقعی</h3></div><button class="close" onclick="closeModal()">×</button></div><div class="gameStage"><div><div style="font-size:58px">🧸</div><h3>${esc(x?.fa||'بازی کوتاه')}</h3><p>${esc(x?.activity||'سه واژه را بشنوید و به شیء واقعی اشاره کنید.')}</p><button class="btn primary" onclick="completeParent(${planIndex})">ثبت مشاهده والد</button></div></div>`)};window.completeParent=i=>{addEvent({type:'parent_observation',minutes:2,skill:'listening'});markPlan(i);closeModal();renderAll();toast('مشاهده والد ثبت شد')};
function showGate(force=false){if(!force&&sessionStorage.getItem('flh5_started'))return;let pid=p().id,l=state.session?.language||p().languages[0],lv=p(pid).levels[l],dur=p(pid).dailyMinutes;const box=document.getElementById('gate');box.classList.remove('hidden');const render=()=>{const pf=p(pid),allowed=pf.ageBand==='preschool_3_4'?['A0','A1']:pf.ageBand==='school_10_12'?['A0','A1','A2']:Object.keys(LEVELS);box.innerHTML=`<div class="gateBox"><div class="gateTitle"><span class="pill">شروع نشست</span><h2>چه کسی و کدام زبان؟</h2><p class="muted">برنامه روز بر اساس سن، سطح و هدف ساخته می‌شود.</p></div><div class="memberChoices">${state.profiles.map(x=>`<button class="chooseMember ${x.id===pid?'active':''}" data-gmember="${x.id}">${profileAvatar(x)}<strong>${esc(x.name)}</strong><small>${ageText(x)}</small></button>`).join('')}</div><div class="langChoices">${pf.languages.map(x=>`<button class="langChoice ${x===l?'active':''}" data-glang="${x}"><b>${LANG[x].flag}</b><strong>${LANG[x].name}</strong><small>${LANG[x].fa}</small></button>`).join('')}</div><div class="sectionHead" style="margin-top:14px"><h3>مرحله فعلی</h3><small>با ایموجی و توضیح ساده</small></div><div class="levelChoices">${allowed.map(x=>`<button class="levelChoice ${x===lv?'active':''}" data-glevel="${x}"><b>${LEVELS[x][0]}</b><strong>${x}</strong><small>${LEVELS[x][1]}</small></button>`).join('')}</div><div class="sectionHead" style="margin-top:14px"><h3>مدت نشست</h3></div><div class="durationChoices">${durations(pf).map(x=>`<button class="${x===dur?'active':''}" data-gdur="${x}">${x} دقیقه</button>`).join('')}</div><button id="gateStart" class="btn primary" style="width:100%;margin-top:16px">ساخت برنامه امروز</button></div>`;box.querySelectorAll('[data-gmember]').forEach(b=>b.onclick=()=>{pid=b.dataset.gmember;l=p(pid).languages[0];lv=p(pid).levels[l];dur=p(pid).dailyMinutes;render()});box.querySelectorAll('[data-glang]').forEach(b=>b.onclick=()=>{l=b.dataset.glang;lv=p(pid).levels[l];render()});box.querySelectorAll('[data-glevel]').forEach(b=>b.onclick=()=>{lv=b.dataset.glevel;render()});box.querySelectorAll('[data-gdur]').forEach(b=>b.onclick=()=>{dur=+b.dataset.gdur;render()});document.getElementById('gateStart').onclick=()=>{state.settings.activeProfileId=pid;p(pid).levels[l]=lv;state.session={profileId:pid,language:l,duration:dur,completed:[],startedAt:now()};save();sessionStorage.setItem('flh5_started','1');box.classList.add('hidden');renderAll()}};render()}
function durations(x){return x.ageBand==='preschool_3_4'?[5,7,8]:x.ageBand==='school_10_12'?[15,20,25,30]:[20,30,45,60,90]}
window.exportData=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='family-language-hub-v5-'+dateKey()+'.json';a.click();URL.revokeObjectURL(a.href);toast('پشتیبان ساخته شد')};function importData(f){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.profiles||!x.events)throw Error();state=merge(x);save();renderAll();toast('پشتیبان بازیابی شد')}catch{toast('فایل معتبر نیست')}};r.readAsText(f)}window.resetApp=()=>{if(confirm('داده محلی این دستگاه پاک شود؟')){localStorage.removeItem(KEY);state=defaults();save();renderAll();showGate(true)}};
let cloudClient=null,syncTimer;const cloud={configured:!!(CFG.supabaseUrl&&CFG.supabaseAnonKey),user:null,status:'local'};function loadSupabase(){return new Promise((res,rej)=>{if(window.supabase)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}async function initCloud(){if(!cloud.configured){updateSync();return}try{await loadSupabase();cloudClient=supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);const {data}=await cloudClient.auth.getUser();cloud.user=data.user||null;if(cloud.user)await syncNow(true);cloudClient.auth.onAuthStateChange((_e,s)=>{cloud.user=s?.user||null;updateSync()})}catch{cloud.status='error';updateSync()}}function scheduleSync(){if(!cloud.user)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(true),1200)}function updateSync(){const d=document.querySelector('.sync .dot'),t=document.getElementById('syncText');if(!d||!t)return;d.className='dot '+cloud.status;t.textContent=cloud.status==='online'?'همگام با ابر':cloud.status==='pending'?'در حال همگام‌سازی':cloud.status==='error'?'خطای همگام‌سازی':'حالت محلی'}async function registerDevice(){const {error}=await cloudClient.from('device_registry').upsert({user_id:cloud.user.id,device_id:deviceId(),device_name:navigator.userAgent.includes('Mobile')?'mobile':'desktop',last_seen_at:now()},{onConflict:'user_id,device_id'});if(error)throw error}
window.signUp=async()=>{try{const email=document.getElementById('cloudEmail').value.trim(),password=document.getElementById('cloudPassword').value;if(password.length<8)throw Error('رمز حداقل ۸ نویسه');const {data,error}=await cloudClient.auth.signUp({email,password});if(error)throw error;cloud.user=data.user;toast(data.session?'حساب ساخته شد':'ایمیل تأیید را بررسی کنید')}catch(e){toast(e.message)}};window.signIn=async()=>{try{const {data,error}=await cloudClient.auth.signInWithPassword({email:document.getElementById('cloudEmail').value.trim(),password:document.getElementById('cloudPassword').value});if(error)throw error;cloud.user=data.user;await syncNow();renderSettings()}catch(e){toast(e.message)}};window.signOut=async()=>{await cloudClient.auth.signOut();cloud.user=null;cloud.status='local';updateSync();renderSettings()};window.syncNow=async silent=>{if(!cloud.user)return;try{cloud.status='pending';updateSync();await registerDevice();const uid0=cloud.user.id;const [pr,er]=await Promise.all([cloudClient.from('family_profiles').select('profile_id,payload,updated_at'),cloudClient.from('learning_events').select('event_id,payload,occurred_at').order('occurred_at')]);if(pr.error)throw pr.error;if(er.error)throw er.error;const pm=new Map(state.profiles.map(x=>[x.id,x]));pr.data.forEach(r=>{const local=pm.get(r.profile_id);if(!local||new Date(r.updated_at)>new Date(local.updatedAt||0))pm.set(r.profile_id,{...r.payload,updatedAt:r.updated_at})});state.profiles=[...pm.values()];const em=new Map(state.events.map(x=>[x.id,x]));er.data.forEach(r=>em.set(r.event_id,r.payload));state.events=[...em.values()].sort((a,b)=>a.createdAt.localeCompare(b.createdAt));let r=await cloudClient.from('family_profiles').upsert(state.profiles.map(x=>({user_id:uid0,profile_id:x.id,payload:x,updated_at:x.updatedAt||now()})),{onConflict:'user_id,profile_id'});if(r.error)throw r.error;const rows=state.events.map(x=>({user_id:uid0,event_id:x.id,profile_id:x.profileId,language:x.language,event_type:x.type,occurred_at:x.createdAt,payload:x}));for(let i=0;i<rows.length;i+=100){r=await cloudClient.from('learning_events').upsert(rows.slice(i,i+100),{onConflict:'event_id'});if(r.error)throw r.error}localStorage.setItem(KEY,JSON.stringify(state));cloud.status='online';updateSync();if(!silent){renderAll();toast('دو دستگاه همگام شدند')}}catch(e){cloud.status='error';updateSync();toast(e.message)}};
window.switchLang=()=>{const l=lang()==='en'?'de':'en';state.session={profileId:p().id,language:l,duration:p().dailyMinutes,completed:[],startedAt:now()};save();renderAll()};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.getElementById('newSession').onclick=()=>showGate(true);document.getElementById('backup').onclick=window.exportData;document.getElementById('changeLang').onclick=window.switchLang;document.getElementById('startToday').onclick=window.startPlan;document.getElementById('importFile').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
setTimeout(()=>{document.getElementById('boot').classList.add('hidden');document.getElementById('app').classList.remove('hidden');if(!state.session){state.session={profileId:p().id,language:p().languages[0],duration:p().dailyMinutes,completed:[],startedAt:now()};save()}renderAll();initCloud();showGate(!sessionStorage.getItem('flh5_started'))},80);
})();
</script>
</body></html>
